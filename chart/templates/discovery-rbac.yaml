{{- if eq .Values.discovery.mode "kubernetes" -}}
{{- $accountName := printf "%s-discovery" .Release.Name -}}
{{- $roleName := printf "%s-%s-discovery" .Release.Namespace .Release.Name -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $accountName }}
  namespace: {{ .Release.Namespace | quote }}
automountServiceAccountToken: false
{{- range .Values.discovery.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  namespace: {{ . | quote }}
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}
  namespace: {{ . | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $accountName }}
    namespace: {{ $.Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
{{- end }}
{{- end }}
