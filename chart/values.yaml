image:
  repository: ghcr.io/binghzal/homelab-dashboard
  # Set digest to the tested published build. Mutable latest is not used.
  digest: ""
  tag: ""
imagePullSecrets: []
# In-memory OIDC sessions deliberately have one owner. A rollout signs users in again.
publicOrigin: https://dashboard.example.com
oidcIssuer: https://auth.example.com/application/o/dashboard/
oidcClientId: homelab-dashboard
# Secret contains only OIDC_CLIENT_SECRET and SESSION_SECRET.
existingSecret: dashboard-credentials
# Set only one: catalog for an automatically rolled configuration, or an external
# ConfigMap containing catalog.yaml. External ConfigMap changes require a restart.
existingConfigMap: ""
catalog: {}
podLabels: {}
extraEnv: []
# Opt-in route discovery. Static catalog entries and access rules remain supported.
# Kubernetes mode reads only HTTPRoutes in the explicit namespace allowlist.
# File mode reads an existing ConfigMap in the release namespace without API access.
discovery:
  mode: disabled
  namespaces: []
  intervalSeconds: 30
  maxAgeSeconds: 90
  existingConfigMap: ""
  fileKey: routes.json
persistence:
  # Retained single-writer preference database, not application credentials.
  existingClaim: ""
  storageClassName: ""
  size: 1Gi
nodeSelector: {}
tolerations: []
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {cpu: "1", memory: 384Mi}
httpRoute:
  enabled: false
  hostname: dashboard.example.com
  parentRefs: []
